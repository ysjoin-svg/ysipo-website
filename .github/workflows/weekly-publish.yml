name: Weekly Article Draft

# 每週一台北 09:00 發文，由 Ubuntu Server cron 觸發（GitHub 自身排程不可靠，已停用 schedule 避免雙跑）
on:
  workflow_dispatch: {}    # 由 Ubuntu cron 觸發，也可在 Actions 頁面手動 Run

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install image processor
        run: npm ci

      - name: Generate article draft
        working-directory: scripts
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          REVIEW_DRAFT_FILE: ${{ runner.temp }}/article-draft.json
        run: node generate-article.js --draft

      - name: Submit for review
        id: submit
        env:
          REVIEW_INGEST_KEY: ${{ secrets.REVIEW_INGEST_KEY }}
        run: node scripts/submit-review-draft.js "${{ runner.temp }}/article-draft.json"

      - name: Email owner full draft and review buttons
        if: steps.submit.outputs.count != '0'
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 永旭審稿 <${{ secrets.MAIL_USERNAME }}>
          to: taiejoin@hotmail.com
          subject: '[永旭] 智財文章待審核'
          html_body: file://${{ runner.temp }}/review-owner.html

      - name: Email north office full draft and review buttons
        if: steps.submit.outputs.count != '0'
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 永旭審稿 <${{ secrets.MAIL_USERNAME }}>
          to: fish801113@gmail.com
          subject: '[永旭] 智財文章待審核'
          html_body: file://${{ runner.temp }}/review-north.html

      - name: Notify both reviewers on failure
        if: failure()
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 永旭審稿 <${{ secrets.MAIL_USERNAME }}>
          to: taiejoin@hotmail.com,fish801113@gmail.com
          subject: '[永旭] 智財文章草稿產生失敗'
          body: |
            本週文章草稿未產生，也未發布。請查看工作紀錄：
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
