    service: http://localhost:80
  - hostname: weight.ysipo.com.tw
    service: http://localhost:8000
  - hostname: lug.ysipo.com.tw
    service: http://localhost:4000
  - hostname: mj.ysipo.com.tw
    service: http://localhost:4100
  - hostname: ldns.ysipo.com.tw
    service: http://localhost:4200
  - hostname: review.ysipo.com.tw
    service: http://localhost:4310
  - service: http_status:404
